name: FjordMail checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: fjordmail
          POSTGRES_USER: fjordmail
          POSTGRES_PASSWORD: ci-fixture-only
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U fjordmail" --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql://fjordmail:ci-fixture-only@127.0.0.1:5432/fjordmail
      APP_ENCRYPTION_KEY: ci-fixture-only-encryption-key-01234567890123456789
      FIRST_ADMIN_PASSWORD: Foundation-test-admin-20261013!
      TEST_BASE_URL: http://127.0.0.1:8101
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=high
      - name: Actual database/API integration
        run: |
          npm start > /tmp/fjordmail-ci.log 2>&1 &
          for attempt in $(seq 1 20); do curl -fsS http://127.0.0.1:8101/api/health && break || sleep 1; done
          npm run test:integration
